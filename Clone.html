<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Next Vork - India's #1 Construction App</title>

  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Navigation Bar -->
  <header class="navbar">

    <div class="logo">
      Next Vork
    </div>

    <nav class="nav-links">
      <a href="#" class="active">Home</a>
      <a href="#">Contact Us</a>
      <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram" ></a>
      <i class="fa-brands fa-instagram"></i> </a>
      <!-- LinkedIn --> 
      <a href="https://in.linkedin.com/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" > 
      <i class="fa-brands fa-linkedin-in"></i> </a>
    </nav>

    <a href="#" class="btn-download">
      Download App
    </a>

  </header>


  <!-- Hero Section -->
  <section class="hero-container">

    <!-- Left Content -->
    <div class="hero-content">

      <h1 class="hero-title">
        India’s #1 <br>
        Construction App
      </h1>

      <p class="hero-subtitle">
        Quick, Affordable Service at your doorstep
      </p>


      <!-- Search Form -->
      <form class="booking-form" onsubmit="event.preventDefault();">

        <div class="input-group">

          <i class="fa-solid fa-magnifying-glass input-icon"></i>

          <input
            type="text"
            placeholder="Search Your Service"
            required
          >

        </div>


        <button type="submit" class="btn-book">
          Book Service
        </button>

      </form>

    </div>


    <!-- Right Image -->
    <div class="hero-image">

      <img
        src="zenzys-landing.png"
        alt="Next Vork Construction Services"
      >

    </div>

  </section>

</body>
</html>
